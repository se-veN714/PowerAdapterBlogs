<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — PowerAdapter</title>
    <link rel="stylesheet" href="/static/css/errors/page-error.css">
</head>
<body class="error-page">

<!-- TV scanline texture (reused from index hero) -->
<div class="scanline-layer"></div>

<main class="error-layout">

    <!-- ===== Left: Info ===== -->
    <section class="error-info">
        <div class="error-code">
            {{ error_code|default:"500" }}
        </div>

        <div class="error-message">
            The render process interrupted.<br>
            Something unexpected happened.<br>
            The system temporarily lost its balance.
        </div>

        <div class="system-status">
            system unstable
        </div>

        <div class="process-log">
            observe(woRld)
            fail(stAte)
        </div>

        <a href="/" class="error-back-link">
            Return Home <span class="link-arrow">&rarr;</span>
        </a>
    </section>

    <!-- ===== Right: Visual ===== -->
    <section class="error-visual">
        <div class="instability-layer"></div>
        <div class="fragment-layer"></div>
        <div class="signal-layer"></div>

        {% block error_visual %}
        {% include "pages/errors/error-visual-skate.svg" %}
        {% endblock %}
    </section>

</main>

</body>
</html>
