<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器错误 - 500</title>
    <link rel="stylesheet" href="static/css/errors/page-error.css">
    <style>

    </style>
</head>
<body class="error-page">

<div class="background-layer"></div>

<main class="error-layout">

    <section class="error-info">
        <div class="error-code">
            500
        </div>

        <div class="error-message">
            The render process interrupted.<br>
            Something unexpected happened.<br>
            The system temporarily lost its balance.
        </div>

        <div class="system-status">
            system unstable
        </div>

        <div class="process-log">
            observe(woRld)
            fail(stAte)
        </div>
    </section>

    <section class="error-visual">
        <div class="instability-layer"></div>
        <div class="fragment-layer"></div>
        <div class="signal-layer"></div>
    </section>

</main>

</body>
</html>
