<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="skyGradCode" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0D1010"/>
            <stop offset="100%" stop-color="#141818"/>
        </linearGradient>
    </defs>
    <rect width="400" height="300" fill="url(#skyGradCode)"/>

    <!-- Line numbers -->
    <g font-family="monospace" font-size="10.5" opacity="0.2">
        <text x="16" y="44" fill="rgb(216,255,225)">01</text>
        <text x="16" y="60" fill="rgb(216,255,225)">02</text>
        <text x="16" y="76" fill="rgb(216,255,225)">03</text>
        <text x="16" y="92" fill="rgb(216,255,225)">04</text>
        <text x="16" y="108" fill="rgb(216,255,225)">05</text>
        <text x="16" y="124" fill="rgb(201,120,120)">06</text>
        <text x="16" y="140" fill="rgb(201,120,120)">07</text>
        <text x="16" y="156" fill="rgb(201,120,120)">08</text>
        <text x="16" y="172" fill="rgb(201,120,120)">09</text>
        <text x="16" y="188" fill="rgb(143,163,148)">10</text>
        <text x="16" y="204" fill="rgb(143,163,148)">11</text>
        <text x="16" y="220" fill="rgb(143,163,148)">12</text>
    </g>

    <!-- Code lines -->
    <g font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="10.5">

        <!-- Normal lines -->
        <text x="50" y="44" fill="rgb(170,180,170)">
            <tspan fill="rgb(216,255,225)">def</tspan> <tspan fill="rgb(235,240,235)">solve_problem</tspan>(<tspan fill="rgb(235,240,235)">problem</tspan>):
        </text>

        <text x="50" y="60" fill="rgb(170,180,170)">
            <tspan fill="rgb(235,240,235)">observed</tspan> = <tspan fill="rgb(235,240,235)">analyze</tspan>(<tspan fill="rgb(235,240,235)">problem</tspan>)
        </text>

        <text x="50" y="76" fill="rgb(170,180,170)">
            <tspan fill="rgb(216,255,225)">if</tspan> <tspan fill="rgb(235,240,235)">insight</tspan>:
        </text>

        <text x="50" y="92" fill="rgb(170,180,170)">
            <tspan fill="rgb(216,255,225)">return</tspan> <tspan fill="rgb(235,240,235)">iterate</tspan>(<tspan fill="rgb(235,240,235)">problem</tspan>)
        </text>

        <text x="50" y="108" fill="rgb(170,180,170)">&nbsp;</text>

        <!-- ERROR: Exception line -->
        <text x="50" y="124" fill="rgb(201,120,120)">
            <tspan font-weight="600">Exception</tspan>: <tspan>NoneType has no attribute 'solve'</tspan>
        </text>

        <!-- Traceback -->
        <text x="54" y="140" fill="rgb(207,181,126)" opacity="0.8">File "core/engine.py", line 42, in solve</text>
        <text x="54" y="156" fill="rgb(143,163,148)" opacity="0.6">    return self.iterate(data)</text>
        <text x="54" y="172" fill="rgb(143,163,148)" opacity="0.5">TypeError: 'NoneType' object is not callable</text>

        <!-- Comment lines (dimmed) -->
        <text x="50" y="188" fill="rgb(95,105,100)" opacity="0.4"># Write less.</text>
        <text x="50" y="204" fill="rgb(95,105,100)" opacity="0.3"># Do more.</text>
        <text x="50" y="220" fill="rgb(95,105,100)" opacity="0.25"># Repeat.</text>
    </g>

    <!-- Error highlight background for line 06 -->
    <rect x="46" y="113" width="340" height="17" fill="rgb(201,120,120)" opacity="0.08"/>
    <line x1="20" y1="130" x2="38" y2="130" stroke="rgb(201,120,120)" stroke-width="1.5" opacity="0.6"/>

    <!-- Glitch artifacts -->
    <rect x="45" y="125" width="340" height="1.5" fill="rgb(201,120,120)" opacity="0.15"
          transform="translate(-3, 1) skewX(-5deg)"/>
    <rect x="48" y="128" width="200" height="1" fill="rgb(201,120,120)" opacity="0.1"
          transform="translate(5, -2) skewX(3deg)"/>

    <!-- Cursor blinking indicator -->
    <rect x="165" y="112" width="7" height="14" fill="rgb(216,255,225)" opacity="0.15">
        <animate attributeName="opacity" values="0.15;0;0.15" dur="1.2s" repeatCount="indefinite"/>
    </rect>

    <!-- Bottom status bar -->
    <rect x="0" y="275" width="400" height="25" fill="rgba(28,35,35,0.9)"/>
    <text x="12" y="291" font-family="monospace" font-size="8" fill="rgb(95,105,100)" opacity="0.6">TracebackError</text>
    <text x="388" y="291" font-family="monospace" font-size="8" fill="rgb(201,120,120)" opacity="0.5" text-anchor="end">&#x2718;</text>
</svg>
