{% if is_paginated %}<nav class="moderation-pagination" aria-label="分页">{% if page_obj.has_previous %}<a class="btn-ghost" href="?page={{ page_obj.previous_page_number }}&q={{ request.GET.q|urlencode }}&state={{ request.GET.state|urlencode }}&status={{ request.GET.status|urlencode }}">上一页</a>{% endif %}<span class="moderation-meta">{{ page_obj.number }} / {{ paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="btn-ghost" href="?page={{ page_obj.next_page_number }}&q={{ request.GET.q|urlencode }}&state={{ request.GET.state|urlencode }}&status={{ request.GET.status|urlencode }}">下一页</a>{% endif %}</nav>{% endif %}
