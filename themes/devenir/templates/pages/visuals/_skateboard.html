{% load static %}
<div class="skateboard-visual-shell" role="img" aria-label="Skateboarder in motion">
    <svg class="board-orbit" viewBox="0 0 200 200" aria-hidden="true">
        <defs><path id="boardCirclePath" d="M100,20 a80,80 0 1,1 -0.1,0"/></defs>
        <text><textPath href="#boardCirclePath" startOffset="0%">
            DESIRE · THINK · BUILD · PLAY · DESIRE · THINK · BUILD · PLAY ·
        </textPath></text>
    </svg>
    <img class="board-skateboarder-image"
         src="{% static 'images/boards/skateboard-editorial-saya.webp' %}"
         width="1448"
         height="1086"
         loading="lazy"
         decoding="async"
         alt="">
</div>
